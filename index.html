<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>support center hp</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <header class="w-full bg-white text-blue-600 flex flex-col md:flex-row items-center shadow justify-center md:justify-between px-5 py-5">
        <div class="text-2xl font-bold">NPO法人未来まなび支援センター</div>
        <p>ホーム</p>
        <p>私たちについて</p>
        <p>活動内容</p>
        <p>お問い合わせ</p>
    </header>
    <main class="w-full bg-gray-100">
        <h1 class="text-gray-900 text-center pt-10 text-3xl font-bold">活動内容
            <ul class="grid grid-cols-1 md:grid-cols-3 px-5 py-5 justify-between items-center gap-4">
                <li class="text-2xl font-bold text-center bg-pink-300 rounded-lg shadow mb-5 p-4">学習サポート
                    <p class="text-sm text-center">子どもたち一人ひとりに寄り添う</p>
                </li>
                <li class="text-2xl font-bold text-center bg-pink-300 rounded-lg shadow mb-5 p-4">体験イベント
                    <p class="text-sm text-center">好奇心や挑戦する力をはぐくむ</p>
                </li>
                <li class="text-2xl font-bold text-center bg-pink-300 rounded-lg shadow mb-5 p-4">地域交流
                    <p class="text-sm text-center">世代を超えた交流</p>
                </li>
            </ul>
        </h1>
    </main>
    <footer class="w-full bg-white text-gray-900 text-center py-6">
        <div>＠2026 NPO法人未来まなび支援センター</div>
    </footer>
